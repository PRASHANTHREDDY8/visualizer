<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Interview Playground — Senior Engineer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent2: #3fb950;
      --accent3: #d2a8ff;
      --accent4: #f78166;
      --warning: #d29922;
      --editor-bg: #0d1117;
      --sidebar-w: 320px;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    }

    .light {
      --bg: #ffffff;
      --surface: #f6f8fa;
      --surface2: #eaeef2;
      --border: #d0d7de;
      --text: #1f2328;
      --text-muted: #656d76;
      --accent: #0969da;
      --accent2: #1a7f37;
      --accent3: #8250df;
      --accent4: #cf222e;
      --warning: #9a6700;
      --editor-bg: #f6f8fa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      transition: background 0.3s, color 0.3s;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100vh;
      overflow-y: auto;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s;
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 10;
    }

    .sidebar-header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 53px;
      background: var(--surface);
      z-index: 10;
    }

    .sidebar-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .sidebar-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .sidebar-tab:hover { color: var(--text); }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .category {
      margin-bottom: 4px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      border-radius: var(--radius);
      transition: background 0.2s;
    }

    .category-header:hover { background: var(--surface2); }

    .category-header .arrow {
      transition: transform 0.2s;
      font-size: 10px;
    }

    .category-header.collapsed .arrow { transform: rotate(-90deg); }

    .category-items { padding-left: 8px; }
    .category-header.collapsed + .category-items { display: none; }

    .question-item {
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
      line-height: 1.4;
      border-left: 2px solid transparent;
    }

    .question-item:hover {
      background: var(--surface2);
      color: var(--text);
    }

    .question-item.active {
      background: var(--surface2);
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .question-item .q-num {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Schema panel */
    .schema-panel {
      padding: 12px;
    }

    .schema-table {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .schema-table-name {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface2);
      color: var(--accent3);
      font-family: var(--mono);
    }

    .schema-cols {
      padding: 6px 12px;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-muted);
      line-height: 1.8;
    }

    .schema-cols .col-name { color: var(--text); }
    .schema-cols .col-type { color: var(--accent); margin-left: 6px; }
    .schema-cols .col-pk { color: var(--warning); margin-left: 4px; font-size: 9px; }

    /* Main area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .toolbar-left { display: flex; align-items: center; gap: 12px; }
    .toolbar-right { display: flex; align-items: center; gap: 8px; }

    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font);
      background: var(--surface2);
      color: var(--text);
    }

    .btn:hover { border-color: var(--text-muted); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover { opacity: 0.9; }

    .btn-success {
      background: var(--accent2);
      color: #fff;
      border-color: var(--accent2);
    }

    .btn-warning {
      background: transparent;
      color: var(--accent3);
      border-color: var(--accent3);
    }

    .theme-toggle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
    }

    .theme-toggle:hover { border-color: var(--accent); }

    /* Question info bar */
    .question-info {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: none;
    }

    .question-info.visible { display: block; }

    .question-info h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .question-info .hint {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      padding: 8px 12px;
      background: var(--surface2);
      border-radius: 6px;
      border-left: 3px solid var(--warning);
    }

    .question-info .difficulty {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      margin-left: 8px;
    }

    .difficulty-medium { background: #d2992220; color: var(--warning); }
    .difficulty-hard { background: #f7816620; color: var(--accent4); }

    /* Editor */
    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .editor-wrapper {
      flex: 0 0 auto;
      height: 220px;
      position: relative;
      border-bottom: 1px solid var(--border);
    }

    .sql-editor {
      width: 100%;
      height: 100%;
      background: var(--editor-bg);
      color: var(--text);
      border: none;
      padding: 16px 20px;
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    .sql-editor::placeholder { color: var(--text-muted); }

    /* Results */
    .results-container {
      flex: 1;
      overflow: auto;
      padding: 16px 20px;
      background: var(--bg);
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .results-header h3 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .results-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-family: var(--mono);
    }

    .results-table th {
      background: var(--surface);
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      color: var(--accent);
      border: 1px solid var(--border);
      font-size: 12px;
      position: sticky;
      top: 0;
    }

    .results-table td {
      padding: 6px 12px;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .results-table tr:hover td { background: var(--surface); }

    .error-msg {
      padding: 12px 16px;
      background: #f7816615;
      border: 1px solid #f7816640;
      border-radius: var(--radius);
      color: var(--accent4);
      font-family: var(--mono);
      font-size: 13px;
      white-space: pre-wrap;
    }

    .success-msg {
      padding: 12px 16px;
      background: #3fb95015;
      border: 1px solid #3fb95040;
      border-radius: var(--radius);
      color: var(--accent2);
      font-size: 13px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .empty-state .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }

    /* Answer section */
    .answer-section {
      margin-top: 16px;
      display: none;
    }

    .answer-section.visible { display: block; }

    .answer-code {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--text);
      overflow-x: auto;
    }

    /* Resize handle */
    .resize-handle {
      height: 4px;
      background: var(--border);
      cursor: row-resize;
      transition: background 0.2s;
    }

    .resize-handle:hover { background: var(--accent); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Mobile toggle */
    .sidebar-toggle {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    @media (max-width: 900px) {
      .sidebar { position: fixed; left: 0; top: 0; z-index: 99; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-toggle { display: flex; }
    }

    /* Loading */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.3s;
    }

    .loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Kbd shortcut hints */
    kbd {
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Initializing SQLite engine...</div>
  </div>

  <button class="sidebar-toggle" id="sidebarToggle">&#9776;</button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>&#128736; SQL Interview Prep</h1>
    </div>
    <div class="sidebar-tabs">
      <div class="sidebar-tab active" data-tab="questions">Questions</div>
      <div class="sidebar-tab" data-tab="schema">Schema</div>
    </div>
    <div class="sidebar-content" id="sidebarContent"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn btn-primary" id="runBtn" title="Ctrl+Enter">&#9654; Run Query</button>
        <button class="btn" id="showAnswerBtn" style="display:none">Show Answer</button>
        <button class="btn btn-warning" id="loadAnswerBtn" style="display:none">Load Answer</button>
      </div>
      <div class="toolbar-right">
        <span style="font-size:11px;color:var(--text-muted)"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to run</span>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">&#9789;</button>
      </div>
    </div>

    <div class="question-info" id="questionInfo">
      <h2 id="questionTitle"></h2>
      <div class="hint" id="questionHint"></div>
    </div>

    <div class="editor-container">
      <div class="editor-wrapper" id="editorWrapper">
        <textarea class="sql-editor" id="sqlEditor" placeholder="-- Write your SQL query here...&#10;-- Select a question from the sidebar or write your own&#10;&#10;SELECT * FROM employees LIMIT 10;" spellcheck="false"></textarea>
      </div>
      <div class="resize-handle" id="resizeHandle"></div>
      <div class="results-container" id="resultsContainer">
        <div class="empty-state">
          <div class="icon">&#128451;</div>
          <div>Run a query to see results here</div>
          <div style="margin-top:8px;font-size:12px;color:var(--text-muted)">Select a question from the sidebar to get started</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // ==================== DATA ====================
    const SCHEMA = [
      {
        name: 'employees',
        cols: [
          { name: 'id', type: 'INTEGER', pk: true },
          { name: 'name', type: 'TEXT' },
          { name: 'department_id', type: 'INTEGER' },
          { name: 'salary', type: 'REAL' },
          { name: 'hire_date', type: 'TEXT' },
          { name: 'manager_id', type: 'INTEGER' }
        ]
      },
      {
        name: 'departments',
        cols: [
          { name: 'id', type: 'INTEGER', pk: true },
          { name: 'name', type: 'TEXT' },
          { name: 'location', type: 'TEXT' }
        ]
      },
      {
        name: 'orders',
        cols: [
          { name: 'id', type: 'INTEGER', pk: true },
          { name: 'customer_id', type: 'INTEGER' },
          { name: 'product_id', type: 'INTEGER' },
          { name: 'quantity', type: 'INTEGER' },
          { name: 'order_date', type: 'TEXT' },
          { name: 'amount', type: 'REAL' }
        ]
      },
      {
        name: 'customers',
        cols: [
          { name: 'id', type: 'INTEGER', pk: true },
          { name: 'name', type: 'TEXT' },
          { name: 'email', type: 'TEXT' },
          { name: 'city', type: 'TEXT' },
          { name: 'created_at', type: 'TEXT' }
        ]
      },
      {
        name: 'products',
        cols: [
          { name: 'id', type: 'INTEGER', pk: true },
          { name: 'name', type: 'TEXT' },
          { name: 'category', type: 'TEXT' },
          { name: 'price', type: 'REAL' },
          { name: 'stock', type: 'INTEGER' }
        ]
      },
      {
        name: 'projects',
        cols: [
          { name: 'id', type: 'INTEGER', pk: true },
          { name: 'name', type: 'TEXT' },
          { name: 'start_date', type: 'TEXT' },
          { name: 'end_date', type: 'TEXT' },
          { name: 'budget', type: 'REAL' }
        ]
      },
      {
        name: 'employee_projects',
        cols: [
          { name: 'employee_id', type: 'INTEGER' },
          { name: 'project_id', type: 'INTEGER' },
          { name: 'role', type: 'TEXT' },
          { name: 'hours_worked', type: 'REAL' }
        ]
      }
    ];

    const QUESTIONS = [
      {
        category: "Window Functions",
        items: [
          {
            id: 1,
            title: "Rank employees by salary within each department",
            hint: "Use RANK() or DENSE_RANK() with PARTITION BY department_id. Consider the difference between RANK and DENSE_RANK for tied salaries.",
            difficulty: "medium",
            answer: `SELECT
  e.name,
  d.name AS department,
  e.salary,
  RANK() OVER (PARTITION BY e.department_id ORDER BY e.salary DESC) AS salary_rank,
  DENSE_RANK() OVER (PARTITION BY e.department_id ORDER BY e.salary DESC) AS dense_rank
FROM employees e
JOIN departments d ON e.department_id = d.id
ORDER BY d.name, salary_rank;`
          },
          {
            id: 2,
            title: "Find the top 3 highest paid employees per department",
            hint: "Use a CTE with ROW_NUMBER() partitioned by department, then filter where row_num <= 3.",
            difficulty: "medium",
            answer: `WITH ranked AS (
  SELECT
    e.name,
    d.name AS department,
    e.salary,
    ROW_NUMBER() OVER (PARTITION BY e.department_id ORDER BY e.salary DESC) AS rn
  FROM employees e
  JOIN departments d ON e.department_id = d.id
)
SELECT name, department, salary
FROM ranked
WHERE rn <= 3
ORDER BY department, salary DESC;`
          },
          {
            id: 3,
            title: "Calculate running total of order amounts by date",
            hint: "Use SUM() as a window function with ORDER BY order_date. The frame defaults to ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW.",
            difficulty: "medium",
            answer: `SELECT
  order_date,
  amount,
  SUM(amount) OVER (ORDER BY order_date) AS running_total,
  COUNT(*) OVER (ORDER BY order_date) AS cumulative_orders
FROM orders
ORDER BY order_date;`
          },
          {
            id: 4,
            title: "Find salary difference from previous and next employee (by hire date)",
            hint: "Use LAG() and LEAD() functions to access previous and next row values.",
            difficulty: "medium",
            answer: `SELECT
  name,
  hire_date,
  salary,
  LAG(salary) OVER (ORDER BY hire_date) AS prev_salary,
  LEAD(salary) OVER (ORDER BY hire_date) AS next_salary,
  salary - LAG(salary) OVER (ORDER BY hire_date) AS diff_from_prev
FROM employees
ORDER BY hire_date;`
          },
          {
            id: 5,
            title: "Divide employees into 4 salary quartiles",
            hint: "Use NTILE(4) to distribute rows into roughly equal groups.",
            difficulty: "medium",
            answer: `SELECT
  name,
  salary,
  NTILE(4) OVER (ORDER BY salary) AS quartile,
  CASE NTILE(4) OVER (ORDER BY salary)
    WHEN 1 THEN 'Bottom 25%'
    WHEN 2 THEN '25-50%'
    WHEN 3 THEN '50-75%'
    WHEN 4 THEN 'Top 25%'
  END AS quartile_label
FROM employees
ORDER BY salary;`
          },
          {
            id: 6,
            title: "Calculate moving average of order amounts (3-day window)",
            hint: "Use AVG() with ROWS BETWEEN to define a sliding window frame.",
            difficulty: "hard",
            answer: `SELECT
  order_date,
  amount,
  ROUND(AVG(amount) OVER (
    ORDER BY order_date
    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
  ), 2) AS moving_avg_3day,
  COUNT(*) OVER (
    ORDER BY order_date
    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
  ) AS window_size
FROM orders
ORDER BY order_date;`
          }
        ]
      },
      {
        category: "CTEs & Recursive Queries",
        items: [
          {
            id: 7,
            title: "Build employee hierarchy (org chart) using recursive CTE",
            hint: "Use a recursive CTE starting from employees where manager_id IS NULL, then join back to find direct reports at each level.",
            difficulty: "hard",
            answer: `WITH RECURSIVE org_chart AS (
  -- Base case: top-level managers
  SELECT
    id, name, manager_id,
    0 AS level,
    name AS path
  FROM employees
  WHERE manager_id IS NULL

  UNION ALL

  -- Recursive case: employees who report to someone in the previous level
  SELECT
    e.id, e.name, e.manager_id,
    oc.level + 1,
    oc.path || ' > ' || e.name
  FROM employees e
  JOIN org_chart oc ON e.manager_id = oc.id
)
SELECT
  SUBSTR('                    ', 1, level * 4) || name AS org_tree,
  level,
  path
FROM org_chart
ORDER BY path;`
          },
          {
            id: 8,
            title: "Find all direct and indirect reports for a manager",
            hint: "Similar to org chart but filter the base case to a specific manager. Count reports at each level.",
            difficulty: "hard",
            answer: `WITH RECURSIVE reports AS (
  SELECT id, name, manager_id, 1 AS depth
  FROM employees
  WHERE manager_id = 1  -- Reports of employee #1

  UNION ALL

  SELECT e.id, e.name, e.manager_id, r.depth + 1
  FROM employees e
  JOIN reports r ON e.manager_id = r.id
)
SELECT
  name,
  depth,
  (SELECT name FROM employees WHERE id = reports.manager_id) AS reports_to
FROM reports
ORDER BY depth, name;`
          },
          {
            id: 9,
            title: "Generate a date series and find days with no orders",
            hint: "Use recursive CTE to generate dates, then LEFT JOIN with orders to find gaps.",
            difficulty: "hard",
            answer: `WITH RECURSIVE date_series AS (
  SELECT DATE('2024-01-01') AS dt
  UNION ALL
  SELECT DATE(dt, '+1 day')
  FROM date_series
  WHERE dt < '2024-03-31'
)
SELECT
  ds.dt AS date,
  COALESCE(COUNT(o.id), 0) AS order_count,
  COALESCE(SUM(o.amount), 0) AS daily_revenue
FROM date_series ds

    `;

    // ==================== APP STATE ====================
    let db = null;
    let currentQuestion = null;
    let answerVisible = false;

    // ==================== INIT ====================
    async function init() {
      try {
        const SQL = await initSqlJs({
          locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
        });
        db = new SQL.Database();
        db.run(INIT_SQL);

        renderSidebar();
        setupEventListeners();
        document.getElementById('loading').classList.add('hidden');
      } catch (err) {
        document.getElementById('loading').innerHTML = `
          <div style="color:var(--accent4);text-align:center;padding:20px;">
            <div style="font-size:24px;margin-bottom:12px;">&#9888;</div>
            <div>Failed to initialize SQL engine</div>
            <div style="font-size:12px;margin-top:8px;color:var(--text-muted)">${err.message}</div>
          </div>`;
      }
    }

    // ==================== RENDER ====================
    function renderSidebar() {
      renderQuestions();
    }

    function renderQuestions() {
      const container = document.getElementById('sidebarContent');
      let html = '<div class="questions-panel">';

      QUESTIONS.forEach((cat, catIdx) => {
        html += `<div class="category">
          <div class="category-header" onclick="toggleCategory(this)">
            <span class="arrow">&#9660;</span>
            <span>${cat.category}</span>
            <span style="margin-left:auto;font-size:11px;opacity:0.6">${cat.items.length}</span>
          </div>
          <div class="category-items">`;

        cat.items.forEach(q => {
          html += `<div class="question-item" data-id="${q.id}" onclick="selectQuestion(${q.id})">
            <span class="q-num">#${q.id}</span> ${q.title}
          </div>`;
        });

        html += '</div></div>';
      });

      html += '</div>';
      container.innerHTML = html;
    }

    function renderSchema() {
      const container = document.getElementById('sidebarContent');
      let html = '<div class="schema-panel">';

      SCHEMA.forEach(table => {
        html += `<div class="schema-table">
          <div class="schema-table-name">${table.name}</div>
          <div class="schema-cols">`;

        table.cols.forEach(col => {
          html += `<div>
            <span class="col-name">${col.name}</span>
            <span class="col-type">${col.type}</span>
            ${col.pk ? '<span class="col-pk">PK</span>' : ''}
          </div>`;
        });

        html += '</div></div>';
      });

      html += '</div>';
      container.innerHTML = html;
    }

    function renderResults(results) {
      const container = document.getElementById('resultsContainer');

      if (!results || results.length === 0) {
        container.innerHTML = '<div class="success-msg">Query executed successfully (no results to display)</div>';
        return;
      }

      let html = '';
      results.forEach((result, idx) => {
        const rowCount = result.values.length;
        html += `<div class="results-header">
          <h3>Results${results.length > 1 ? ` (Statement ${idx + 1})` : ''}</h3>
          <span class="results-meta">${rowCount} row${rowCount !== 1 ? 's' : ''} returned</span>
        </div>`;

        html += '<table class="results-table"><thead><tr>';
        result.columns.forEach(col => { html += `<th>${col}</th>`; });
        html += '</tr></thead><tbody>';

        result.values.forEach(row => {
          html += '<tr>';
          row.forEach(val => {
            html += `<td>${val === null ? '<span style="color:var(--text-muted);font-style:italic">NULL</span>' : escapeHtml(String(val))}</td>`;
          });
          html += '</tr>';
        });

        html += '</tbody></table>';
      });

      container.innerHTML = html;
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ==================== ACTIONS ====================
    function runQuery() {
      const sql = document.getElementById('sqlEditor').value.trim();
      if (!sql) return;

      try {
        const results = db.exec(sql);
        renderResults(results);
      } catch (err) {
        document.getElementById('resultsContainer').innerHTML =
          `<div class="error-msg">&#10060; ${escapeHtml(err.message)}</div>`;
      }
    }

    function selectQuestion(id) {
      let question = null;
      for (const cat of QUESTIONS) {
        question = cat.items.find(q => q.id === id);
        if (question) break;
      }
      if (!question) return;

      currentQuestion = question;
      answerVisible = false;

      // Update active state
      document.querySelectorAll('.question-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`.question-item[data-id="${id}"]`)?.classList.add('active');

      // Show question info
      const info = document.getElementById('questionInfo');
      info.classList.add('visible');
      document.getElementById('questionTitle').innerHTML = `#${question.id}: ${question.title}` +
        `<span class="difficulty difficulty-${question.difficulty}">${question.difficulty}</span>`;
      document.getElementById('questionHint').textContent = question.hint;

      // Show answer buttons
      document.getElementById('showAnswerBtn').style.display = 'inline-block';
      document.getElementById('loadAnswerBtn').style.display = 'inline-block';

      // Clear editor placeholder
      const editor = document.getElementById('sqlEditor');
      if (!editor.value.trim()) {
        editor.placeholder = `-- ${question.title}\n-- Hint: ${question.hint}\n\n`;
      }

      // Hide answer section
      const answerSection = document.querySelector('.answer-section');
      if (answerSection) answerSection.remove();

      // Close sidebar on mobile
      document.getElementById('sidebar').classList.remove('open');
    }

    function showAnswer() {
      if (!currentQuestion) return;
      answerVisible = !answerVisible;

      const btn = document.getElementById('showAnswerBtn');

      if (answerVisible) {
        btn.textContent = 'Hide Answer';
        let section = document.querySelector('.answer-section');
        if (!section) {
          section = document.createElement('div');
          section.className = 'answer-section visible';
          section.innerHTML = `<div class="answer-code">${escapeHtml(currentQuestion.answer)}</div>`;
          document.getElementById('resultsContainer').appendChild(section);
        } else {
          section.classList.add('visible');
        }
      } else {
        btn.textContent = 'Show Answer';
        const section = document.querySelector('.answer-section');
        if (section) section.classList.remove('visible');
      }
    }

    function loadAnswer() {
      if (!currentQuestion) return;
      document.getElementById('sqlEditor').value = currentQuestion.answer;
    }

    function toggleCategory(header) {
      header.classList.toggle('collapsed');
    }

    function toggleTheme() {
      document.body.classList.toggle('light');
      const btn = document.getElementById('themeToggle');
      btn.textContent = document.body.classList.contains('light') ? '&#9728;' : '&#9789;';
    }

    // ==================== EVENT LISTENERS ====================
    function setupEventListeners() {
      document.getElementById('runBtn').addEventListener('click', runQuery);
      document.getElementById('showAnswerBtn').addEventListener('click', showAnswer);
      document.getElementById('loadAnswerBtn').addEventListener('click', loadAnswer);
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
      document.getElementById('sidebarToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
      });

      // Keyboard shortcut
      document.getElementById('sqlEditor').addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          runQuery();
        }
        // Tab key inserts spaces
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = e.target.selectionStart;
          const end = e.target.selectionEnd;
          e.target.value = e.target.value.substring(0, start) + '  ' + e.target.value.substring(end);
          e.target.selectionStart = e.target.selectionEnd = start + 2;
        }
      });

      // Sidebar tabs
      document.querySelectorAll('.sidebar-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          if (tab.dataset.tab === 'questions') renderQuestions();
          else renderSchema();
        });
      });

      // Resize handle
      const handle = document.getElementById('resizeHandle');
      const editorWrapper = document.getElementById('editorWrapper');
      let startY, startHeight;

      handle.addEventListener('mousedown', (e) => {
        startY = e.clientY;
        startHeight = editorWrapper.offsetHeight;
        document.addEventListener('mousemove', onResize);
        document.addEventListener('mouseup', stopResize);
      });

      function onResize(e) {
        const newHeight = startHeight + (e.clientY - startY);
        if (newHeight > 100 && newHeight < window.innerHeight - 200) {
          editorWrapper.style.height = newHeight + 'px';
        }
      }

      function stopResize() {
        document.removeEventListener('mousemove', onResize);
        document.removeEventListener('mouseup', stopResize);
      }
    }

    // ==================== START ====================
    init();
  </script>
</body>
</html>
